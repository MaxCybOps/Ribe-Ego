version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ribeego_postgres
    environment:
      POSTGRES_USER: ribeego_user
      POSTGRES_PASSWORD: ribeego_secure_password_2026
      POSTGRES_DB: ribeego_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ribeego_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ribeego_backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://ribeego_user:ribeego_secure_password_2026@postgres:5432/ribeego_db?schema=public
      JWT_SECRET: ribeego-jwt-secret-production-2026
      DEFAULT_COMMISSION_RATE: 0.07
      LIGHTNING_PROVIDER: mock
      PRICE_LOCK_SECONDS: 90
      BTC_USD_PRICE: 65000.00
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ribeego_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:4000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
